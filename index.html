<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ストップウォッチ（記録機能付き）</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 300px;
        }
        #timer {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        .buttons button {
            font-size: 16px;
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            color: white;
        }
        #startStopBtn { background-color: #28a745; }
        #resetBtn { background-color: #6c757d; }
        button:hover { opacity: 0.8; }

        /* 記録エリアのスタイル */
        .records {
            margin-top: 25px;
            text-align: left;
            border-top: 2px solid #f0f0f0;
            padding-top: 15px;
        }
        .records h3 {
            font-size: 14px;
            margin: 0 0 10px 0;
            color: #666;
            text-align: center;
        }
        .records ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 150px;
            overflow-y: auto; /* 履歴が増えたらスクロールを表示 */
        }
        .records li {
            padding: 6px 12px;
            border-bottom: 1px solid #f9f9f9;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            color: #444;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="timer">00:00:00</div>
        <div class="buttons">
            <button id="startStopBtn" onclick="toggleTimer()">スタート</button>
            <button id="resetBtn" onclick="resetTimer()">リセット</button>
        </div>

        <!-- 計測履歴を表示するエリア -->
        <div class="records">
            <h3>計測履歴</h3>
            <ul id="recordList"></ul>
        </div>
    </div>

    <script>
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval;
        let isRunning = false;
        let recordCount = 0;

        function printTime(txt) {
            document.getElementById("timer").innerHTML = txt;
        }

        function timeToString(time) {
            let diffInHrs = time / 3600000;
            let hh = Math.floor(diffInHrs);

            let diffInMin = (diffInHrs - hh) * 60;
            let mm = Math.floor(diffInMin);

            let diffInSec = (diffInMin - mm) * 60;
            let ss = Math.floor(diffInSec);

            let ms = Math.floor((diffInSec - ss) * 100);

            let formattedMM = mm.toString().padStart(2, "0");
            let formattedSS = ss.toString().padStart(2, "0");
            let formattedMS = ms.toString().padStart(2, "0");

            return `${formattedMM}:${formattedSS}:${formattedMS}`;
        }

        function toggleTimer() {
            const btn = document.getElementById("startStopBtn");

            if (!isRunning) {
                // スタート処理
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(function() {
                    elapsedTime = Date.now() - startTime;
                    printTime(timeToString(elapsedTime));
                }, 10);

                isRunning = true;
                btn.textContent = "ストップ";
                btn.style.backgroundColor = "#dc3545";
            } else {
                // ストップ処理
                clearInterval(timerInterval);
                isRunning = false;
                btn.textContent = "スタート";
                btn.style.backgroundColor = "#28a745";

                // ★ストップを押した時のタイムをリストに追加
                addRecord(timeToString(elapsedTime));
            }
        }

        // 記録をリストに追加する関数
        function addRecord(timeStr) {
            recordCount++;
            const recordList = document.getElementById("recordList");
            const li = document.createElement("li");
            li.innerHTML = `<span>記録 #${recordCount}</span> <span><strong>${timeStr}</strong></span>`;
            
            // 最新の記録が一番上にくるように追加
            recordList.prepend(li);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            printTime("00:00:00");
            elapsedTime = 0;
            isRunning = false;
            recordCount = 0;

            const btn = document.getElementById("startStopBtn");
            btn.textContent = "スタート";
            btn.style.backgroundColor = "#28a745";

            // リセット時に履歴も全消去
            document.getElementById("recordList").innerHTML = "";
        }
    </script>

</body>
</html>
