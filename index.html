<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ストップウォッチ</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #timer {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        .buttons button {
            font-size: 16px;
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            color: white;
        }
        #startBtn { background-color: #28a745; }
        #stopBtn { background-color: #dc3545; }
        #resetBtn { background-color: #6c757d; }
        button:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="container">
        <div id="timer">00:00:00</div>
        <div class="buttons">
            <button id="startBtn" onclick="startTimer()">スタート</button>
            <button id="stopBtn" onclick="stopTimer()">ストップ</button>
            <button id="resetBtn" onclick="resetTimer()">リセット</button>
        </div>
    </div>

    <script>
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval;
        let isRunning = false;

        function printTime(txt) {
            document.getElementById("timer").innerHTML = txt;
        }

        function timeToString(time) {
            let diffInHrs = time / 3600000;
            let hh = Math.floor(diffInHrs);

            let diffInMin = (diffInHrs - hh) * 60;
            let mm = Math.floor(diffInMin);

            let diffInSec = (diffInMin - mm) * 60;
            let ss = Math.floor(diffInSec);

            let ms = Math.floor((diffInSec - ss) * 100);

            let formattedMM = mm.toString().padStart(2, "0");
            let formattedSS = ss.toString().padStart(2, "0");
            let formattedMS = ms.toString().padStart(2, "0");

            return `${formattedMM}:${formattedSS}:${formattedMS}`;
        }

        function startTimer() {
            if (!isRunning) {
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(function() {
                    elapsedTime = Date.now() - startTime;
                    printTime(timeToString(elapsedTime));
                }, 10);
                isRunning = true;
            }
        }

        function stopTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            printTime("00:00:00");
            elapsedTime = 0;
            isRunning = false;
        }
    </script>

</body>
</html>
